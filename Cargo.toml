[package]
name = "labcapture"
version = "0.2.0"
edition = "2024"
description = "LabCapture - take screenshots and record your screen"

[dependencies]
arboard = "3.7.0"
bytes = "1.12.2"
chrono = "0.4.45"
cpal = "0.18.2"
dirs = "7.0.0"
eframe = { version = "0.37.0", features = ["persistence"] }
gif = "0.14.2"
global-hotkey = "0.10.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
mp4 = "0.14.0"
open = "5.4.5"
openh264 = "0.9.10"
raw-window-handle = "0.6.2"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
xcap = "0.9.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
] }

[target.'cfg(target_os = "macos")'.dependencies]
winit = "0.30"

# Pixel work (capture, video encoding, markup) needs optimised code even in
# debug builds, or recording stutters.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
